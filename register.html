<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - PlacementHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">
        🎓 PlacementHub
    </a>
    <div style="display:flex; align-items:center; gap:16px;">
        <nav>
            <a href="index.html">Home</a>
            <a href="jobs.html">Drives</a>
            <a href="login.html">Login</a>
        </nav>
        <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌙</button>
    </div>
</header>

<main style="max-width: 480px; margin: 40px auto; padding: 20px;">
    <div class="readiness-card">
        <h2>Create Placement Account</h2>
        <p style="color:var(--text-muted); font-size:13px; margin-bottom: 20px;">Join your campus placement portal to get matched with corporate drives</p>

        <form id="registerForm">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label>University / Corporate Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Password (Minimum 8 characters)</label>
            <input type="password" id="password" placeholder="Minimum 8 characters" minlength="8" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>

            <label>Account Role</label>
            <select id="role" required>
                <option value="">Select Role...</option>
                <option value="STUDENT">Student Candidate</option>
                <option value="COMPANY">Partner Recruiter</option>
            </select>

            <button type="submit" class="btn btn-primary btn-full" style="padding:12px;" id="registerBtn">
                Create Account
            </button>
        </form>

        <p id="registerMessage" style="margin-top:12px; font-size:13px; font-weight:600; text-align:center;"></p>

        <p style="margin-top: 18px; text-align: center; font-size: 13px; color: var(--text-secondary);">
            Already have an account? <a href="login.html" style="color:var(--primary); font-weight:600;">Sign in here</a>
        </p>
    </div>
</main>

<script src="common.js"></script>
<script src="register.js"></script>

</body>
</html>
